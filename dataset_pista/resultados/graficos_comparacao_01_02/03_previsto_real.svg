<text x="750" y="380" font-size="19" style="fill:#172033" text-anchor="start" font-weight="normal">−1: lado esquerdo</text>
<text x="750" y="420" font-size="19" style="fill:#172033" text-anchor="start" font-weight="normal">0: centro da imagem</text>
